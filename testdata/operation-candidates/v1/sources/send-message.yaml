openapi: 3.0.3
info:
  title: Message API
  version: 1.0.0
paths:
  /messages:
    post:
      operationId: sendMessage
      summary: Send a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [message_id]
                properties:
                  message_id:
                    type: string
